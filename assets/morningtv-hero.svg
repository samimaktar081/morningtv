<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 470" width="100%" height="100%">
  <defs>
    <style>
      * {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Glow and Ambient Lighting */
      .card-glow {
        filter: drop-shadow(0 20px 50px rgba(124, 58, 237, 0.18));
      }

      @keyframes radar-pulse {
        0% { r: 6px; opacity: 0.95; stroke-width: 1.5px; }
        50% { r: 16px; opacity: 0.35; stroke-width: 2px; }
        100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
      }

      .pulse-ring {
        animation: radar-pulse 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        transform-origin: center;
      }

      @keyframes wave-pulse {
        0%, 100% { height: 6px; y: 12px; }
        50% { height: 22px; y: 4px; }
      }

      .wave-1 { animation: wave-pulse 1.2s ease-in-out infinite 0.1s; }
      .wave-2 { animation: wave-pulse 1.4s ease-in-out infinite 0.3s; }
      .wave-3 { animation: wave-pulse 1.1s ease-in-out infinite 0.5s; }
      .wave-4 { animation: wave-pulse 1.3s ease-in-out infinite 0.2s; }
      .wave-5 { animation: wave-pulse 1.5s ease-in-out infinite 0.4s; }

      @keyframes neon-border {
        0%, 100% { stroke: #334155; }
        50% { stroke: #8B5CF6; }
      }

      .border-glow {
        animation: neon-border 4s ease-in-out infinite;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <linearGradient id="neonCyanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="sunLogoGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <linearGradient id="glassCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="ambientBacklight" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <clipPath id="innerClip">
      <rect x="12" y="12" width="1000" height="446" rx="22" />
    </clipPath>
  </defs>

  <!-- Base Card Frame -->
  <rect x="12" y="12" width="1000" height="446" rx="22" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" class="card-glow border-glow" />
  
  <!-- Ambient Radial Light -->
  <rect x="12" y="12" width="1000" height="446" rx="22" fill="url(#ambientBacklight)" clip-path="url(#innerClip)" />

  <!-- Grid Dot Pattern for High-Tech Studio Aesthetic -->
  <g opacity="0.08" clip-path="url(#innerClip)">
    <pattern id="gridDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" />
    </pattern>
    <rect x="12" y="12" width="1000" height="446" fill="url(#gridDots)" />
  </g>

  <!-- ================= TOP HEADER BAR ================= -->
  <g transform="translate(36, 32)">
    <!-- Brand Logo Icon: 🌅 Rising Sun inside Rounded Hexagon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="34" r="16" fill="url(#sunLogoGrad)" />
      <rect x="8" y="34" width="40" height="14" fill="#1E293B" />
      <line x1="10" y1="34" x2="46" y2="34" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="12" x2="28" y2="7" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
      <line x1="18" y1="17" x2="14" y2="13" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
      <line x1="38" y1="17" x2="42" y2="13" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
      <rect x="6" y="6" width="44" height="44" rx="10" fill="none" stroke="url(#neonCyanPurple)" stroke-width="1.5" />
    </g>

    <!-- Title and Identity -->
    <g transform="translate(70, 6)">
      <text x="0" y="24" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">MorningTV</text>
      <text x="160" y="24" fill="#94A3B8" font-size="13" font-weight="600">v1.1.6</text>
      <text x="0" y="44" fill="#94A3B8" font-size="12.5" font-weight="500">
        High-Performance 4K Native Windows Live TV Player &amp; Cloud Stream Sentinel
      </text>
    </g>

    <!-- Right Live Status Badge -->
    <g transform="translate(760, 10)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="17" r="5" fill="none" stroke="#22C55E" class="pulse-ring" />
      <circle cx="22" cy="17" r="5" fill="#22C55E" />
      <text x="36" y="21" fill="#F1F5F9" font-size="11.5" font-weight="700">TOKIO AXUM PROXY</text>
    </g>
  </g>

  <!-- ================= MIDDLE HERO METRICS ================= -->
  <!-- 4 Core Architectural Pillar Cards -->
  <g transform="translate(36, 114)">
    <!-- Pillar 1: Sub-Second Zap -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="224" height="118" rx="16" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="32" cy="30" r="14" fill="#0284C7" fill-opacity="0.2" />
      <path d="M32 20 L27 28 L32 28 L31 38 L37 29 L32 29 Z" fill="#38BDF8" />
      <text x="56" y="26" fill="#94A3B8" font-size="10.5" font-weight="700">SUB-SECOND ZAP</text>
      <text x="56" y="44" fill="#38BDF8" font-size="18" font-weight="800">&lt; 0.4s Latency</text>
      <text x="18" y="74" fill="#94A3B8" font-size="10.5" font-weight="400">
        <tspan x="18" dy="0">Predictive RAM pre-warming</tspan>
        <tspan x="18" dy="15">&amp; zero-blackout frosted aura.</tspan>
      </text>
    </g>

    <!-- Pillar 2: Tokio Axum Proxy -->
    <g transform="translate(242, 0)">
      <rect x="0" y="0" width="224" height="118" rx="16" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="32" cy="30" r="14" fill="#8B5CF6" fill-opacity="0.2" />
      <path d="M26 30 L32 23 L38 30 M32 24 V37" stroke="#A855F7" stroke-width="2" stroke-linecap="round" fill="none" />
      <text x="56" y="26" fill="#94A3B8" font-size="10.5" font-weight="700">STREAMING ENGINE</text>
      <text x="56" y="44" fill="#A855F7" font-size="18" font-weight="800">In-Process Axum</text>
      <text x="18" y="74" fill="#94A3B8" font-size="10.5" font-weight="400">
        <tspan x="18" dy="0">Loopback 127.0.0.1:18181</tspan>
        <tspan x="18" dy="15">CORS bypass &amp; chunk cache.</tspan>
      </text>
    </g>

    <!-- Pillar 3: Audio Booster -->
    <g transform="translate(484, 0)">
      <rect x="0" y="0" width="224" height="118" rx="16" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="32" cy="30" r="14" fill="#10B981" fill-opacity="0.2" />
      <g transform="translate(20, 18)">
        <rect x="4" y="10" width="2.5" height="10" rx="1" fill="#34D399" class="wave-1" />
        <rect x="8" y="6" width="2.5" height="18" rx="1" fill="#34D399" class="wave-2" />
        <rect x="12" y="8" width="2.5" height="14" rx="1" fill="#34D399" class="wave-3" />
        <rect x="16" y="4" width="2.5" height="22" rx="1" fill="#34D399" class="wave-4" />
        <rect x="20" y="11" width="2.5" height="8" rx="1" fill="#34D399" class="wave-5" />
      </g>
      <text x="56" y="26" fill="#94A3B8" font-size="10.5" font-weight="700">SOUND BOOSTER</text>
      <text x="56" y="44" fill="#34D399" font-size="18" font-weight="800">300% GainNode</text>
      <text x="18" y="74" fill="#94A3B8" font-size="10.5" font-weight="400">
        <tspan x="18" dy="0">Web Audio API pipeline with</tspan>
        <tspan x="18" dy="15">anti-clipping compressor.</tspan>
      </text>
    </g>

    <!-- Pillar 4: Cloud Stream Sentinel -->
    <g transform="translate(726, 0)">
      <rect x="0" y="0" width="224" height="118" rx="16" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="32" cy="30" r="14" fill="#F59E0B" fill-opacity="0.2" />
      <path d="M32 20 L38 23 V31 C38 35 32 38 32 38 C32 38 26 35 26 31 V23 Z" fill="#FBBF24" />
      <text x="56" y="26" fill="#94A3B8" font-size="10.5" font-weight="700">STREAM SENTINEL</text>
      <text x="56" y="44" fill="#FBBF24" font-size="18" font-weight="800">24/7 Audited</text>
      <text x="18" y="74" fill="#94A3B8" font-size="10.5" font-weight="400">
        <tspan x="18" dy="0">Scans 10,000+ feeds in parallel;</tspan>
        <tspan x="18" dy="15">verifies MPEG-TS 0x47 sync.</tspan>
      </text>
    </g>
  </g>

  <!-- ================= TECHNOLOGY PILLS BAR ================= -->
  <g transform="translate(36, 252)">
    <rect x="0" y="0" width="108" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#EF4444" />
    <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">Rust 2021</text>

    <g transform="translate(118, 0)">
      <rect x="0" y="0" width="106" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#8B5CF6" />
      <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">Tauri v2.12</text>
    </g>

    <g transform="translate(234, 0)">
      <rect x="0" y="0" width="106" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#06B6D4" />
      <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">Tokio 1.40</text>
    </g>

    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="106" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#00D8FE" />
      <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">React 19.3</text>
    </g>

    <g transform="translate(466, 0)">
      <rect x="0" y="0" width="118" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#38BDF8" />
      <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">Tailwind v4.3</text>
    </g>

    <g transform="translate(594, 0)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#3B82F6" />
      <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">rusqlite 0.31</text>
    </g>

    <g transform="translate(716, 0)">
      <rect x="0" y="0" width="106" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#F59E0B" />
      <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">hls.js 1.7.3</text>
    </g>

    <g transform="translate(832, 0)">
      <rect x="0" y="0" width="118" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#10B981" />
      <text x="30" y="18" fill="#F1F5F9" font-size="11" font-weight="700">Minisign Ed25519</text>
    </g>
  </g>

  <!-- ================= BOTTOM ACTION BAR ================= -->
  <g transform="translate(36, 308)">
    <rect x="0" y="0" width="952" height="120" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />

    <!-- Feature Highlights List -->
    <g transform="translate(24, 24)">
      <circle cx="6" cy="6" r="4" fill="#8B5CF6" />
      <text x="20" y="10" fill="#E2E8F0" font-size="12" font-weight="600">
        Liquid Glass UI: Apple TV OS Channel Shelf, Dock, EPG Timeline, &amp; Stream Quality Switcher.
      </text>

      <g transform="translate(0, 28)">
        <circle cx="6" cy="6" r="4" fill="#06B6D4" />
        <text x="20" y="10" fill="#E2E8F0" font-size="12" font-weight="600">
          Smart Companion: AI Voice Assistant, Command Palette, and Telegram Remote Control.
        </text>
      </g>

      <g transform="translate(0, 56)">
        <circle cx="6" cy="6" r="4" fill="#10B981" />
        <text x="20" y="10" fill="#E2E8F0" font-size="12" font-weight="600">
          Ultra-Compact Setup: ~5.1 MB NSIS installer with process-tree cleanup and automatic delta updates.
        </text>
      </g>
    </g>

    <!-- Right Button: Production Repo Link -->
    <g transform="translate(720, 39)">
      <rect x="0" y="0" width="206" height="42" rx="12" fill="url(#neonCyanPurple)" />
      <text x="103" y="26" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">
        ORGANIZATION REPO ↗
      </text>
    </g>
  </g>
</svg>
